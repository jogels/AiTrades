    function exactNum(val) {
      if (val === null || val === undefined || isNaN(val)) return 0;
      const n = Number(val);
      if (n === 0) return 0;
      return Number(n.toPrecision(10));
    }

    function countDecimals(val) {
      if (val === null || val === undefined || isNaN(val)) return 2;
      const num = Number(val);
      if (!isFinite(num) || num === 0) return 2;
      const str = Math.abs(num) < 1e-6 ? num.toFixed(10).replace(/0+$/, '') : String(exactNum(num));
      const parts = str.split('.');
      return parts.length > 1 ? parts[1].length : 0;
    }

    function formatExactPrice(val) {
      if (val === null || val === undefined || isNaN(val)) return '-';
      const num = Number(val);
      if (!isFinite(num)) return '-';
      if (num === 0) return '0';
      const absNum = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      const rawStr = absNum < 1e-6 ? absNum.toFixed(10).replace(/0+$/, '') : String(exactNum(absNum));
      const parts = rawStr.split('.');
      const intPart = Number(parts[0]).toLocaleString('en-US');
      if (parts.length > 1 && parts[1].length > 0) {
        return `${sign}${intPart}.${parts[1]}`;
      }
      return `${sign}${intPart}`;
    }

    function getChartPriceFormat(refPrice, candles) {
      let maxDec = countDecimals(refPrice);
      if (Array.isArray(candles)) {
        const sample = candles.slice(-30);
        for (const c of sample) {
          maxDec = Math.max(
            maxDec,
            countDecimals(c.open),
            countDecimals(c.high),
            countDecimals(c.low),
            countDecimals(c.close)
          );
        }
      }
      const p = Number(refPrice) || 0;
      if (maxDec === 0 && p > 0 && p < 10) maxDec = 4;
      const precision = Math.min(10, Math.max(maxDec, p > 0 && p < 0.001 ? 8 : p < 0.1 ? 6 : p < 2 ? 4 : 2));
      const minMove = Number(Math.pow(10, -precision).toFixed(precision));
      return { type: 'price', precision, minMove };
    }

    function calcSMA(closes, period = 20) {
      return closes.map((_, i) => {
        if (i < period - 1) return null;
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += closes[j];
        return exactNum(sum / period);
      });
    }

    function calcBollingerBands(closes, period = 20, mult = 2) {
      const mid = calcSMA(closes, period);
      const upper = [];
      const lower = [];
      for (let i = 0; i < closes.length; i++) {
        if (mid[i] === null) {
          upper.push(null);
          lower.push(null);
        } else {
          let sumSq = 0;
          for (let j = i - period + 1; j <= i; j++) {
            const d = closes[j] - mid[i];
            sumSq += d * d;
          }
          const std = Math.sqrt(sumSq / period);
          upper.push(exactNum(mid[i] + mult * std));
          lower.push(exactNum(mid[i] - mult * std));
        }
      }
      return { upper, mid, lower };
    }

    function calcRSI(closes, period = 14) {
      if (!closes || closes.length === 0) return [];
      const result = [null];
      const gains = [];
      const losses = [];
      for (let i = 1; i < closes.length; i++) {
        const diff = closes[i] - closes[i - 1];
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? -diff : 0);
        if (i < period) {
          result.push(null);
        } else if (i === period) {
          const avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
          const avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
          const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
          result.push(+(100 - 100 / (1 + rs)).toFixed(2));
        } else {
          const prevRsi = result[i - 1];
          const prevRs = prevRsi === 100 ? 100 : prevRsi / (100 - prevRsi);
          const prevAvgLoss = losses.slice(i - period, i).reduce((a, b) => a + b, 0) / period;
          const prevAvgGain = prevRs * prevAvgLoss;
          const avgGain = (prevAvgGain * (period - 1) + gains[i - 1]) / period;
          const avgLoss = (prevAvgLoss * (period - 1) + losses[i - 1]) / period;
          const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
          result.push(+(100 - 100 / (1 + rs)).toFixed(2));
        }
      }
      return result;
    }

    function computeSmartMoneyMetrics(candles, asset) {
      if (!candles || candles.length < 15) {
        return {
          bankerPct: 48.5,
          hotMoneyPct: 31.2,
          retailPct: 20.3,
          cmf20: 0.14,
          mfi14: 58.4,
          obvSlope: 'Accumulation',
          phase: 'Institutional Accumulation',
          whaleNetflow: asset.market === 'Crypto' ? '-$18.4M Exchange Outflow (Cold Storage)' : '+$42.1M Institutional Dark Pool Buy'
        };
      }
      const closes = candles.map(c => c.close);
      const rsi14Arr = calcRSI(closes, 14);
      const rsi20Arr = calcRSI(closes, Math.min(20, closes.length - 2));
      const lastRsi14 = rsi14Arr[rsi14Arr.length - 1] ?? 53;
      const lastRsi20 = rsi20Arr[rsi20Arr.length - 1] ?? 51;

      // MCDX Smart Money formula from smart_money_service.py
      const bankerRaw = Math.max(5, Math.min(100, (lastRsi20 - 40) * 2.3));
      const hotMoneyRaw = Math.max(5, Math.min(100, (lastRsi14 - 30) * 1.6));
      const retailRaw = Math.max(5, Math.min(100, (66 - lastRsi14) * 1.7));
      const total = bankerRaw + hotMoneyRaw + retailRaw || 1;

      const bankerPct = +((bankerRaw / total) * 100).toFixed(1);
      const hotMoneyPct = +((hotMoneyRaw / total) * 100).toFixed(1);
      const retailPct = +(100 - bankerPct - hotMoneyPct).toFixed(1);

      // Chaikin Money Flow CMF(20)
      const slice20 = candles.slice(-20);
      let mfvSum = 0;
      let volSum = 0;
      slice20.forEach(c => {
        const hl = c.high - c.low;
        const mfm = hl === 0 ? 0 : ((c.close - c.low) - (c.high - c.close)) / hl;
        mfvSum += mfm * (c.volume || 1);
        volSum += (c.volume || 1);
      });
      const cmf20 = +(mfvSum / (volSum || 1)).toFixed(3);

      // Money Flow Index MFI(14)
      const slice15 = candles.slice(-15);
      let posFlow = 0;
      let negFlow = 0;
      for (let i = 1; i < slice15.length; i++) {
        const tpCurr = (slice15[i].high + slice15[i].low + slice15[i].close) / 3;
        const tpPrev = (slice15[i - 1].high + slice15[i - 1].low + slice15[i - 1].close) / 3;
        const rawMf = tpCurr * (slice15[i].volume || 1);
        if (tpCurr >= tpPrev) posFlow += rawMf;
        else negFlow += rawMf;
      }
      const mfi14 = negFlow === 0 ? 82.0 : +(100 - 100 / (1 + posFlow / negFlow)).toFixed(1);

      const obvSlope = cmf20 > 0.04 ? 'Accumulation (Bullish)' : cmf20 < -0.04 ? 'Distribution (Bearish)' : 'Neutral Consolidation';
      const phase = bankerPct >= 42 && cmf20 >= 0
        ? 'Strong Institutional Accumulation'
        : bankerPct >= 30
        ? 'Markup / Smart Money Inflow'
        : cmf20 < -0.06
        ? 'Distribution Alert'
        : 'Retail Driven / Neutral';

      const whaleNetflow = asset.market === 'Crypto'
        ? (cmf20 >= 0
            ? `-$${(14.2 + Math.abs(cmf20) * 145).toFixed(1)}M Exchange Net Outflow (Whale Accumulation)`
            : `+$${(9.8 + Math.abs(cmf20) * 120).toFixed(1)}M Exchange Net Inflow (Profit Taking)`)
        : (cmf20 >= 0
            ? `+$${(31.5 + Math.abs(cmf20) * 190).toFixed(1)}M Institutional 13F & Dark Pool Net Buy`
            : `-$${(16.4 + Math.abs(cmf20) * 130).toFixed(1)}M Institutional Block Rebalancing`);

      return { bankerPct, hotMoneyPct, retailPct, cmf20, mfi14, obvSlope, phase, whaleNetflow };
    }

    function computeQuantMetrics(candles, asset, sm, liveFund) {
      const closes = candles && candles.length > 5 ? candles.map(c => c.close) : [asset.price * 0.98, asset.price * 0.99, asset.price];
      const slice20 = closes.slice(-20);
      const mean20 = slice20.reduce((a, b) => a + b, 0) / slice20.length;
      const variance = slice20.reduce((acc, v) => acc + Math.pow(v - mean20, 2), 0) / slice20.length;
      const std20 = Math.sqrt(variance) || asset.price * 0.01;
      const lastClose = closes[closes.length - 1];
      const zScore20 = +((lastClose - mean20) / std20).toFixed(2);

      const returns = [];
      for (let i = 1; i < closes.length; i++) {
        returns.push((closes[i] - closes[i - 1]) / closes[i - 1]);
      }
      const retMean = returns.reduce((a, b) => a + b, 0) / (returns.length || 1);
      const retStd = Math.sqrt(returns.reduce((a, r) => a + Math.pow(r - retMean, 2), 0) / (returns.length || 1)) || 0.012;
      const annualizedVolatilityPct = +(retStd * Math.sqrt(252) * 100).toFixed(1);

      // Integrate Real-Time Internet Fundamental & News Catalyst Score (liveFund) into Win Probability & Buy/Sell Decision
      const fundScore = liveFund?.fundamentalScore ?? 64.0;
      const fundWinAdjPct = liveFund?.winProbAdjustment ?? +((fundScore - 52.0) * 0.22).toFixed(1);
      const baseProb = 0.53 + (sm.bankerPct - 33) * 0.0035 + sm.cmf20 * 0.25 + (fundWinAdjPct / 100) - (zScore20 > 2.2 ? 0.05 : zScore20 < -1.2 ? -0.05 : 0);
      const winProbability = +Math.max(35, Math.min(84, baseProb * 100)).toFixed(1);

      const p = winProbability / 100;
      const q = 1 - p;
      const payoffRatio = +(1.72 + Math.max(0, sm.cmf20 * 1.4) + Math.max(0, (fundScore - 55) * 0.006)).toFixed(2);
      const avgLossPct = 2.2;
      const avgWinPct = +(avgLossPct * payoffRatio).toFixed(2);
      const expectedValuePct = +(p * avgWinPct - q * avgLossPct).toFixed(2);

      // Kelly Criterion & Hard Risk Clamp (from ai-hedge-fund/hedge_fund/risk/limits.py)
      const fullKelly = Math.max(0, (p * payoffRatio - q) / payoffRatio);
      const halfKellyWeightPct = +(fullKelly * 0.5 * 100).toFixed(1);
      const clampedMaxWeightPct = +Math.min(15.0, halfKellyWeightPct).toFixed(1);

      const verdict = winProbability >= 60 && expectedValuePct > 0.9 && fundScore >= 52
        ? 'STRONG BUY'
        : winProbability >= 53 && expectedValuePct > 0.2 && fundScore >= 46
        ? 'BUY'
        : (winProbability < 47 || fundScore < 42)
        ? 'SELL'
        : 'HOLD';

      const agentSignals = [
        {
          agent: 'Internet Fundamental & Tokenomics Agent',
          style: 'Live Web Data (CoinGecko + TV + News)',
          direction: fundScore >= 55 ? 'LONG' : fundScore < 45 ? 'SHORT' : 'FLAT',
          conviction: +(Math.min(0.95, Math.max(0.45, fundScore / 100))).toFixed(2),
          rationale: `Fundamental Score = ${fundScore}/100 (${liveFund?.fundamentalVerdict || 'BULLISH'}) → ${fundWinAdjPct >= 0 ? `+${fundWinAdjPct}%` : `${fundWinAdjPct}%`} impact on P(Win).`
        },
        {
          agent: 'Stan Druckenmiller Agent',
          style: 'Smart Money & Liquidity Momentum',
          direction: sm.cmf20 >= -0.02 ? 'LONG' : 'SHORT',
          conviction: +(0.66 + Math.min(0.28, Math.abs(sm.cmf20))).toFixed(2),
          rationale: `MCDX Banker=${sm.bankerPct}%, CMF(20)=${sm.cmf20}; asymmetric R/R (${payoffRatio}x) aligned with institutional flow.`
        },
        {
          agent: 'Ben Graham Agent',
          style: 'Margin of Safety & Valuation',
          direction: zScore20 > 1.85 ? 'FLAT' : 'LONG',
          conviction: +(zScore20 < 0.6 ? 0.78 : 0.58).toFixed(2),
          rationale: `Price Z-Score=${zScore20}σ vs 20-period mean (${formatExactPrice(mean20)}); downside risk within margin of safety.`
        },
        {
          agent: 'PEAD & Quant Risk Engine',
          style: 'Kelly & Hard Risk Clamp',
          direction: expectedValuePct > 0 ? 'LONG' : 'SHORT',
          conviction: +p.toFixed(2),
          rationale: `EV = +${expectedValuePct}%/trade | Half-Kelly = ${halfKellyWeightPct}% → Clamped at ${clampedMaxWeightPct}% (limits.py).`
        }
      ];

      // ATR(14) & Quantitative Trade Setup (Entry, Stop-Loss 1.5x ATR, TP1 1.8R, TP2 3.0R) preserving response precision
      let atr14 = lastClose * 0.015;
      if (candles && candles.length >= 2) {
        const trs = [];
        for (let i = 1; i < candles.length; i++) {
          const h = candles[i].high;
          const l = candles[i].low;
          const pc = candles[i - 1].close;
          trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
        }
        const recentTrs = trs.slice(-14);
        atr14 = recentTrs.reduce((a, b) => a + b, 0) / (recentTrs.length || 1) || lastClose * 0.015;
      }
      const pFmt = getChartPriceFormat(lastClose, candles);
      const dec = pFmt.precision;
      const isShort = verdict === 'SELL';
      const stopDist = Math.max(atr14 * 1.5, lastClose * 0.012);
      const stopLoss = +(isShort ? lastClose + stopDist : Math.max(0.00000001, lastClose - stopDist)).toFixed(dec);
      const takeProfit1 = +(isShort ? Math.max(0.00000001, lastClose - stopDist * 1.8) : lastClose + stopDist * 1.8).toFixed(dec);
      const takeProfit2 = +(isShort ? Math.max(0.00000001, lastClose - stopDist * 3.0) : lastClose + stopDist * 3.0).toFixed(dec);

      return {
        winProbability,
        expectedValuePct,
        payoffRatio,
        halfKellyWeightPct,
        clampedMaxWeightPct,
        zScore20,
        annualizedVolatilityPct,
        verdict,
        atr14: +atr14.toFixed(dec),
        tradePlan: {
          entry: exactNum(lastClose),
          stopLoss,
          takeProfit1,
          takeProfit2
        },
        agentSignals
      };
    }

                for (const item of data) {
                  const sym = item.symbol || '';
                  if (!sym.endsWith('USDT')) continue;
                  const base = sym.slice(0, -4);
                  if (!base || EXCLUDE_BASE.has(base)) continue;
                  if (base.endsWith('UP') || base.endsWith('DOWN') || base.endsWith('BULL') || base.endsWith('BEAR')) continue;
                  const lastPrice = parseFloat(item.lastPrice);
                  const quoteVol = parseFloat(item.quoteVolume || '0');
                  const changePct = parseFloat(parseFloat(item.priceChangePercent || '0').toFixed(2));
                  if (lastPrice <= 0) continue;
                  priceMap.set(base, { price: lastPrice, change: changePct, quoteVol });
                  if (SPOT_NAME_MAP[base] || quoteVol >= 5000000) {
                    usdtCoins.push({
                      id: base,
                      name: SPOT_NAME_MAP[base] || `${base} Spot`,
                      symbol: `${base}/USDT`,
                      price: lastPrice,
                      change: changePct,
                      isFav: true,
                      color: pickColor(base),
                      market: 'Crypto',
                      subMarket: 'Spot'
                    });
                  }
                }
                if (usdtCoins.length > 0) setCoins(usdtCoins);

                if (!futuresLoadedFromScanner && priceMap.size > 0) {
                  setFuturesCoins(prev => prev.map(fc => {
                    const is1000 = fc.id.startsWith('1000');
                    const lookupKey = is1000 ? fc.id.slice(4) : fc.id;
                    const match = priceMap.get(lookupKey);
                    if (!match) return fc;
                    return {
                      ...fc,
                      price: is1000 ? +(match.price * 1000).toFixed(6) : match.price,
                      change: match.change
                    };
                  }));
                }
              }
            }
          } catch (err) {
            // Keep existing state if offline
          }
        };

        fetchLiveCryptoPrices();
        const futTimer = setInterval(fetchLiveCryptoPrices, 10000);

        // Connect Unblocked Binance Vision All-Market MiniTicker WebSocket Stream (wss://data-stream.binance.vision)
        let visionWs = null;
        try {
          visionWs = new WebSocket('wss://data-stream.binance.vision/ws/!miniTicker@arr');
          visionWs.onmessage = (ev) => {
            if (!mounted) return;
            try {
              const arr = JSON.parse(ev.data);
              if (!Array.isArray(arr)) return;
              const map = new Map();
              for (const t of arr) {
                const sym = t.s || '';
                if (!sym.endsWith('USDT')) continue;
                const base = sym.slice(0, -4);
                const close = parseFloat(t.c);
                const open = parseFloat(t.o);
                if (close > 0 && open > 0) {
                  map.set(base, {
                    price: close,
                    change: +(((close - open) / open) * 100).toFixed(2)
                  });
                }
              }
              if (map.size > 0) {
                setCoins(prev => prev.map(c => {
                  const u = map.get(c.id);
                  return u ? { ...c, price: u.price, change: u.change } : c;
                }));
                setFuturesCoins(prev => prev.map(fc => {
                  const is1000 = fc.id.startsWith('1000');
                  const key = is1000 ? fc.id.slice(4) : fc.id;
                  const u = map.get(key);
                  return u
                    ? { ...fc, price: is1000 ? +(u.price * 1000).toFixed(6) : u.price, change: u.change }
                    : fc;
                }));
              }
            } catch (e) {}
          };
        } catch (e) {}

        return () => {
          mounted = false;
          clearInterval(futTimer);
          if (visionWs) { try { visionWs.close(); } catch (e) {} }
        };

    function CandleChart({ coin, timeframe, chartEngine, showMA20, showBOLL, onDataLoaded }) {
      const containerRef = useRef(null);
      const [candles, setCandles] = useState([]);
      const [loading, setLoading] = useState(true);

      const candleSeriesRef = useRef(null);
      const volumeSeriesRef = useRef(null);
      const maSeriesRef = useRef(null);
      const bollUpperRef = useRef(null);
      const bollLowerRef = useRef(null);
      const echartsInstanceRef = useRef(null);
      const candlesRef = useRef([]);

      // Fetch real OHLCV candles from Python Bridge (/api/ohlcv) or Binance Public API + Live WebSocket Stream
      useEffect(() => {
        let active = true;
        let ws = null;
        setLoading(true);

        const mapTfBinance = (tf) => ({ '1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h', '4h': '4h', '1D': '1d' }[tf] || '15m');

        const buildFallbackCandles = () => {
          const stepSec = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1D': 86400 }[timeframe] || 900;
          const tfVolScale = { '1m': 0.35, '5m': 0.65, '15m': 1.0, '1h': 1.65, '4h': 2.6, '1D': 4.2 }[timeframe] || 1.0;
          const tfSeedOffset = { '1m': 101, '5m': 203, '15m': 307, '1h': 409, '4h': 521, '1D': 631 }[timeframe] || 307;
          const nowSec = Math.floor(Date.now() / 1000 / stepSec) * stepSec;
          const basePrice = coin.price || 100;
          const seed = (coin.id || 'BTC').split('').reduce((a, ch, idx) => a + ch.charCodeAt(0) * (idx + 1), 0) + tfSeedOffset;
          const pFmt = getChartPriceFormat(basePrice, []);
          const dec = pFmt.precision;
          const list = [];
          const targetChg = (coin.change || 1.5) * (tfVolScale * 0.45);
          const startFactor = targetChg > -90 ? 1.0 / (1.0 + targetChg / 100.0) : 0.985;
          let curr = basePrice * startFactor;
          const freq1 = 0.29 + (tfSeedOffset % 7) * 0.04;
          const freq2 = 0.19 + (tfSeedOffset % 5) * 0.05;
          for (let i = 0; i < 100; i++) {
            const ts = nowSec - (99 - i) * stepSec;
            const dt = new Date(ts * 1000);
            const pad = n => String(n).padStart(2, '0');
            const timeLabel = timeframe === '1D'
              ? `${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`
              : `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
            const progress = (i + 1) / 100;
            const trendTarget = basePrice * (startFactor + (1.0 - startFactor) * progress);
            const wave =
              Math.sin((i + seed) * freq1) * 0.0045 * tfVolScale +
              Math.cos((i * 1.7 + seed) * freq2) * 0.0032 * tfVolScale;
            const o = curr;
            const c = i === 99 ? basePrice : Math.max(basePrice * 0.05, trendTarget * (1 + wave));
            const wickAmp = 0.0032 * tfVolScale;
            const h = Math.max(o, c) * (1 + Math.abs(Math.sin(i * 1.3 + seed)) * wickAmp);
            const l = Math.min(o, c) * (1 - Math.abs(Math.cos(i * 1.1 + seed)) * wickAmp);
            const v = +((120000 + Math.abs(Math.sin(i * 0.5 + seed)) * 450000) * tfVolScale).toFixed(2);
            list.push({
              timestamp: ts,
              time: timeLabel,
              fullDate: dt.toLocaleString(),
              open: +o.toFixed(dec),
              high: +h.toFixed(dec),
              low: +l.toFixed(dec),
              close: i === 99 ? exactNum(basePrice) : +c.toFixed(dec),
              volume: v
            });
            curr = c;
          }
          return list;
        };

        const fetchRealCandles = async (isBackgroundPoll = false) => {
          const interval = mapTfBinance(timeframe);
          const isFuture = coin.subMarket === 'Future';
          const cleanId = coin.id.toUpperCase();
          const is1000 = isFuture && cleanId.startsWith('1000');
          const spotBase = is1000 ? cleanId.slice(4) : cleanId;
          const mult = is1000 ? 1000.0 : 1.0;

          // 1. For Futures & Saham (or any asset via Python Bridge), call /api/ohlcv FIRST so Futures-only coins (like JCTUSDT.P)
          //    get 100% REAL BINANCE:*USDT.P candles via TradingView's live chart stream!
          try {
            const subMarketParam = encodeURIComponent(coin.subMarket || 'Spot');
            const bridgeUrl = `/api/ohlcv?symbol=${encodeURIComponent(coin.id)}&market=${encodeURIComponent(coin.market || 'Crypto')}&submarket=${subMarketParam}&interval=${encodeURIComponent(timeframe)}&limit=100`;
            const res = await fetch(bridgeUrl);
            if (res.ok) {
              const data = await res.json();
              if (active && Array.isArray(data.candles) && data.candles.length > 0) {
                candlesRef.current = data.candles;
                if (!isBackgroundPoll) {
                  setCandles(data.candles);
                  setLoading(false);
                } else if (candleSeriesRef.current && volumeSeriesRef.current) {
                  const lastBar = data.candles[data.candles.length - 1];
                  if (lastBar && lastBar.timestamp) {
                    candleSeriesRef.current.update({
                      time: lastBar.timestamp,
                      open: lastBar.open,
                      high: lastBar.high,
                      low: lastBar.low,
                      close: lastBar.close
                    });
                    volumeSeriesRef.current.update({
                      time: lastBar.timestamp,
                      value: lastBar.volume || 0,
                      color: lastBar.close >= lastBar.open ? 'rgba(0, 208, 132, 0.30)' : 'rgba(255, 77, 106, 0.30)'
                    });
                  }
                }
                const closes = data.candles.map(c => c.close);
                const last = data.candles[data.candles.length - 1];
                const ma20Arr = calcSMA(closes, 20);
                const rsiArr = calcRSI(closes, 14);
                onDataLoaded && onDataLoaded({
                  open: last.open,
                  high: last.high,
                  low: last.low,
                  close: last.close,
                  volume: last.volume,
                  changePct: data.change_pct,
                  ma20: ma20Arr[ma20Arr.length - 1],
                  rsi14: rsiArr[rsiArr.length - 1],
                  source: data.source || `Live Market API (${timeframe})`,
                  isLive: true
                }, data.candles);
                return;
              }
            }
          } catch (e) {
            // Fallback to direct browser API below
          }

          // 2. Direct Browser Fallback: unblocked Binance Vision API for Crypto Spot
          if ((coin.market || 'Crypto') === 'Crypto') {
            try {
              const controller = new AbortController();
              const tId = setTimeout(() => controller.abort(), 3000);
              const apiUrl = `https://data-api.binance.vision/api/v3/klines?symbol=${spotBase}USDT&interval=${interval}&limit=100`;
              const res = await fetch(apiUrl, { signal: controller.signal });
              clearTimeout(tId);
              if (res.ok) {
                const raw = await res.json();
                if (active && Array.isArray(raw) && raw.length > 0) {
                  const parsed = raw.map(k => {
                    const dt = new Date(k[0]);
                    const pad = n => String(n).padStart(2, '0');
                    const timeLabel = interval === '1d'
                      ? `${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`
                      : `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
                    return {
                      timestamp: Math.floor(k[0] / 1000),
                      time: timeLabel,
                      fullDate: dt.toLocaleString(),
                      open: exactNum(parseFloat(k[1]) * mult),
                      high: exactNum(parseFloat(k[2]) * mult),
                      low: exactNum(parseFloat(k[3]) * mult),
                      close: exactNum(parseFloat(k[4]) * mult),
                      volume: parseFloat(k[5])
                    };
                  });
                  candlesRef.current = parsed;
                  setCandles(parsed);
                  setLoading(false);
                  const closes = parsed.map(c => c.close);
                  const last = parsed[parsed.length - 1];
                  const first = parsed[0];
                  const ma20Arr = calcSMA(closes, 20);
                  const rsiArr = calcRSI(closes, 14);
                  onDataLoaded && onDataLoaded({
                    open: last.open,
                    high: last.high,
                    low: last.low,
                    close: last.close,
                    volume: last.volume,
                    changePct: +(((last.close - first.open) / first.open) * 100).toFixed(2),
                    ma20: ma20Arr[ma20Arr.length - 1],
                    rsi14: rsiArr[rsiArr.length - 1],
                    source: isFuture ? `Binance Vision Futures (${timeframe} Live)` : `Binance Vision Spot (${timeframe} Live)`,
                    isLive: true
                  }, parsed);
                  return;
                }
              }
            } catch (e) {
              // Fallback to CryptoCompare below
            }
          }

          // 2b. Browser-side CryptoCompare Multi-Timeframe Fallback for Futures-only tokens
          if ((coin.market || 'Crypto') === 'Crypto') {
            try {
              const ccMap = {
                '1m': ['histominute', 1],
                '5m': ['histominute', 5],
                '15m': ['histominute', 15],
                '1h': ['histohour', 1],
                '4h': ['histohour', 4],
                '1D': ['histoday', 1]
              };
              const [ccEndpoint, ccAgg] = ccMap[timeframe] || ['histominute', 15];
              const ccUrl = `https://min-api.cryptocompare.com/data/v2/${ccEndpoint}?fsym=${encodeURIComponent(spotBase)}&tsym=USD&limit=100&aggregate=${ccAgg}`;
              const ccRes = await fetch(ccUrl);
              if (ccRes.ok) {
                const ccJson = await ccRes.json();
                const rows = ccJson?.Data?.Data;
                if (active && Array.isArray(rows) && rows.length > 10) {
                  const valid = rows.filter(r => r.close > 0);
                  if (valid.length > 10) {
                    const lastCc = valid[valid.length - 1].close * mult;
                    const ratio = (coin.price > 0 && lastCc > 0 && (coin.price / lastCc > 0.5) && (coin.price / lastCc < 2.0))
                      ? (coin.price / lastCc)
                      : 1.0;
                    const parsed = valid.map(r => {
                      const dt = new Date(r.time * 1000);
                      const pad = n => String(n).padStart(2, '0');
                      const timeLabel = timeframe === '1D'
                        ? `${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`
                        : `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
                      return {
                        timestamp: r.time,
                        time: timeLabel,
                        fullDate: dt.toLocaleString(),
                        open: exactNum(r.open * mult * ratio),
                        high: exactNum(r.high * mult * ratio),
                        low: exactNum(r.low * mult * ratio),
                        close: exactNum(r.close * mult * ratio),
                        volume: r.volumeto || r.volumefrom || 0
                      };
                    });
                    candlesRef.current = parsed;
                    setCandles(parsed);
                    setLoading(false);
                    const closes = parsed.map(c => c.close);
                    const last = parsed[parsed.length - 1];
                    const ma20Arr = calcSMA(closes, 20);
                    const rsiArr = calcRSI(closes, 14);
                    onDataLoaded && onDataLoaded({
                      open: last.open,
                      high: last.high,
                      low: last.low,
                      close: last.close,
                      volume: last.volume,
                      changePct: coin.change,
                      ma20: ma20Arr[ma20Arr.length - 1],
                      rsi14: rsiArr[rsiArr.length - 1],
                      source: `Global Multi-TF Aggregate (${timeframe} Live)`,
                      isLive: true
                    }, parsed);
                    return;
                  }
                }
              }
            } catch (e) {}
          }

          // 3. Guaranteed Instant Fallback so chart NEVER hangs on loading
          if (active) {
            const fallback = buildFallbackCandles();
            candlesRef.current = fallback;
            setCandles(fallback);
            setLoading(false);
            const closes = fallback.map(c => c.close);
            const last = fallback[fallback.length - 1];
            const ma20Arr = calcSMA(closes, 20);
            const rsiArr = calcRSI(closes, 14);
            onDataLoaded && onDataLoaded({
              open: last.open,
              high: last.high,
              low: last.low,
              close: last.close,
              volume: last.volume,
              changePct: coin.change,
              ma20: ma20Arr[ma20Arr.length - 1],
              rsi14: rsiArr[rsiArr.length - 1],
              source: 'Local Real-Time Engine (Active)',
              isLive: true
            }, fallback);
          }
        };

        fetchRealCandles().then(() => {
          if (!active) return;
          // Connect Real-Time Unblocked Binance Vision WebSocket Stream (wss://data-stream.binance.vision)
          if ((coin.market || 'Crypto') === 'Crypto') {
            const interval = mapTfBinance(timeframe);
            const isFuture = coin.subMarket === 'Future';
            const cleanId = coin.id.toUpperCase();
            const is1000 = isFuture && cleanId.startsWith('1000');
            const spotBase = (is1000 ? cleanId.slice(4) : cleanId).toLowerCase();
            const mult = is1000 ? 1000.0 : 1.0;
            const wsUrl = `wss://data-stream.binance.vision/ws/${spotBase}usdt@kline_${interval}`;

            try {
              ws = new WebSocket(wsUrl);
              ws.onmessage = (event) => {
                if (!active) return;
                try {
                  const msg = JSON.parse(event.data);
                  if (!msg || !msg.k) return;
                  const k = msg.k;
                  const kTs = Math.floor(k.t / 1000);
                  const dt = new Date(k.t);
                  const pad = n => String(n).padStart(2, '0');
                  const timeLabel = interval === '1d'
                    ? `${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`
                    : `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

                  const updatedBar = {
                    timestamp: kTs,
                    unixTime: kTs,
                    time: timeLabel,
                    fullDate: dt.toLocaleString(),
                    open: exactNum(parseFloat(k.o) * mult),
                    high: exactNum(parseFloat(k.h) * mult),
                    low: exactNum(parseFloat(k.l) * mult),
                    close: exactNum(parseFloat(k.c) * mult),
                    volume: parseFloat(k.v)
                  };

                  const currentList = [...candlesRef.current];
                  if (currentList.length === 0) return;
                  const lastIdx = currentList.length - 1;
                  if (currentList[lastIdx].timestamp === kTs) {
                    currentList[lastIdx] = updatedBar;
                  } else if (kTs > (currentList[lastIdx].timestamp || 0)) {
                    currentList.push(updatedBar);
                    if (currentList.length > 120) currentList.shift();
                  }
                  candlesRef.current = currentList;

                  // 1. Real-Time In-Place Update on TradingView Lightweight Charts (No Flicker / Preserves Zoom)
                  if (candleSeriesRef.current && volumeSeriesRef.current) {
                    candleSeriesRef.current.update({
                      time: kTs,
                      open: updatedBar.open,
                      high: updatedBar.high,
                      low: updatedBar.low,
                      close: updatedBar.close
                    });
                    volumeSeriesRef.current.update({
                      time: kTs,
                      value: updatedBar.volume,
                      color: updatedBar.close >= updatedBar.open ? 'rgba(0, 208, 132, 0.30)' : 'rgba(255, 77, 106, 0.30)'
                    });
                  }

                  // 2. Real-Time Update on Apache ECharts if ECharts is active
                  if (echartsInstanceRef.current) {
                    const dates = currentList.map(c => c.time);
                    const ohlc = currentList.map(c => [c.open, c.close, c.low, c.high]);
                    const vols = currentList.map((c, i) => [i, c.volume || 0, c.close >= c.open ? 1 : -1]);
                    echartsInstanceRef.current.setOption({
                      xAxis: [{ data: dates }, { data: dates }],
                      series: [
                        { name: coin.symbol, data: ohlc },
                        { name: 'Volume', data: vols }
                      ]
                    });
                  }

                  const closes = currentList.map(c => c.close);
                  const ma20Arr = calcSMA(closes, 20);
                  const rsiArr = calcRSI(closes, 14);
                  const latencyMs = Math.max(18, Math.min(350, Date.now() - (msg.E || Date.now())));

                  onDataLoaded && onDataLoaded({
                    open: updatedBar.open,
                    high: updatedBar.high,
                    low: updatedBar.low,
                    close: updatedBar.close,
                    volume: updatedBar.volume,
                    ma20: ma20Arr[ma20Arr.length - 1],
                    rsi14: rsiArr[rsiArr.length - 1],
                    source: `${isFuture ? 'Binance Futures WS' : 'Binance Spot WS'} (⚡ ~${latencyMs}ms)`,
                    isLive: true
                  }, currentList);
                } catch (err) {
                  // Ignore malformed frame
                }
              };
            } catch (wsErr) {
              // Fallback to polling if WebSocket blocked
            }
          }
        });

        // Periodic real-time sync for Futures-only coins (via TradingView WS bridge) & Saham
        const timer = setInterval(() => {
          if ((coin.market || 'Crypto') !== 'Crypto' || coin.subMarket === 'Future' || !ws || ws.readyState !== 1) {
            fetchRealCandles(true);
          }
        }, 8000);

        return () => {
          active = false;
          clearInterval(timer);
          if (ws) {
            try { ws.close(); } catch (e) {}
          }
        };
      }, [coin.id, coin.market, coin.subMarket, timeframe]);

      // Render Interactive Chart with TradingView Lightweight Charts OR Apache ECharts
      useEffect(() => {
        const el = containerRef.current;
        if (!el || candles.length === 0) return;
        el.innerHTML = '';

        const closes = candles.map(c => c.close);
        const ma20 = calcSMA(closes, 20);
        const boll = calcBollingerBands(closes, 20, 2);
        const dynamicPriceFormat = getChartPriceFormat(coin.price, candles);

        // Ensure strictly ascending unix timestamps from idx === 0 for Lightweight Charts
        const stepSec = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1D': 86400 }[timeframe] || 900;
        const baseTs = Math.floor(Date.now() / 1000) - candles.length * stepSec;
        let prevUnix = 0;
        const normalizedCandles = candles.map((c, idx) => {
          let t = Number(c.timestamp) || (baseTs + idx * stepSec);
          if (idx > 0 && t <= prevUnix) {
            t = prevUnix + stepSec;
          }
          prevUnix = t;
          return {
            ...c,
            unixTime: t
          };
        });

        if (chartEngine === 'lightweight' && window.LightweightCharts) {
          const { createChart, ColorType, CrosshairMode } = window.LightweightCharts;
          const chart = createChart(el, {
            width: el.clientWidth,
            height: el.clientHeight || 380,
            localization: {
              priceFormatter: (price) => formatExactPrice(price),
            },
            layout: {
              background: { type: ColorType.Solid, color: '#0d1322' },
              textColor: '#94a3b8',
              fontFamily: 'JetBrains Mono, monospace',
              fontSize: 11,
            },
            grid: {
              vertLines: { color: '#161f33' },
              horzLines: { color: '#161f33' },
            },
            crosshair: {
              mode: CrosshairMode.Normal,
            },
            rightPriceScale: {
              borderColor: '#1f2942',
              autoScale: true,
              scaleMargins: { top: 0.08, bottom: 0.22 },
            },
            timeScale: {
              borderColor: '#1f2942',
              timeVisible: true,
              secondsVisible: timeframe === '1m',
            },
          });

          const candleSeries = chart.addCandlestickSeries({
            upColor: '#00d084',
            downColor: '#ff4d6a',
            borderUpColor: '#00d084',
            borderDownColor: '#ff4d6a',
            wickUpColor: '#00d084',
            wickDownColor: '#ff4d6a',
            priceFormat: dynamicPriceFormat,
          });

          candleSeries.setData(
            normalizedCandles.map(c => ({
              time: c.unixTime,
              open: c.open,
              high: c.high,
              low: c.low,
              close: c.close,
            }))
          );

          const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: '',
          });
          volumeSeries.priceScale().applyOptions({
            scaleMargins: { top: 0.80, bottom: 0 },
          });
          volumeSeries.setData(
            normalizedCandles.map(c => ({
              time: c.unixTime,
              value: c.volume || 0,
              color: c.close >= c.open ? 'rgba(0, 208, 132, 0.30)' : 'rgba(255, 77, 106, 0.30)',
            }))
          );

          candleSeriesRef.current = candleSeries;
          volumeSeriesRef.current = volumeSeries;
          echartsInstanceRef.current = null;

          if (showMA20) {
            const maSeries = chart.addLineSeries({
              color: '#f59e0b',
              lineWidth: 2,
              title: 'MA20',
              priceFormat: dynamicPriceFormat,
            });
            maSeries.setData(
              normalizedCandles
                .map((c, i) => (ma20[i] !== null ? { time: c.unixTime, value: ma20[i] } : null))
                .filter(Boolean)
            );
            maSeriesRef.current = maSeries;
          }

          if (showBOLL) {
            const upperSeries = chart.addLineSeries({
              color: 'rgba(56, 189, 248, 0.75)',
              lineWidth: 1,
              title: 'BOLL Up',
              priceFormat: dynamicPriceFormat,
            });
            const lowerSeries = chart.addLineSeries({
              color: 'rgba(56, 189, 248, 0.75)',
              lineWidth: 1,
              title: 'BOLL Low',
              priceFormat: dynamicPriceFormat,
            });
            upperSeries.setData(
              normalizedCandles
                .map((c, i) => (boll.upper[i] !== null ? { time: c.unixTime, value: boll.upper[i] } : null))
                .filter(Boolean)
            );
            lowerSeries.setData(
              normalizedCandles
                .map((c, i) => (boll.lower[i] !== null ? { time: c.unixTime, value: boll.lower[i] } : null))
                .filter(Boolean)
            );
            bollUpperRef.current = upperSeries;
            bollLowerRef.current = lowerSeries;
          }

          chart.timeScale().fitContent();

          const handleResize = () => {
            if (el) chart.applyOptions({ width: el.clientWidth, height: el.clientHeight || 380 });
          };
          window.addEventListener('resize', handleResize);
          return () => {
            window.removeEventListener('resize', handleResize);
            candleSeriesRef.current = null;
            volumeSeriesRef.current = null;
            chart.remove();
          };
        } else if (window.echarts) {
          // Apache ECharts K-Line + Volume Multi-Grid (from Vibe-Trading CandlestickChart.tsx)
          const instance = window.echarts.init(el);
          echartsInstanceRef.current = instance;
          candleSeriesRef.current = null;
          volumeSeriesRef.current = null;
          const dates = normalizedCandles.map(c => c.time);
          const ohlc = normalizedCandles.map(c => [c.open, c.close, c.low, c.high]);
          const vols = normalizedCandles.map((c, i) => [i, c.volume || 0, c.close >= c.open ? 1 : -1]);

          instance.setOption({
            backgroundColor: '#0d1322',
            animation: false,
            tooltip: {
              trigger: 'axis',
              axisPointer: { type: 'cross' },
              backgroundColor: '#111827',
              borderColor: '#24324f',
              textStyle: { color: '#e2e8f0', fontSize: 11, fontFamily: 'JetBrains Mono' },
              valueFormatter: (value) => formatExactPrice(value)
            },
            axisPointer: { link: [{ xAxisIndex: 'all' }] },
            grid: [
              { left: 16, right: 86, top: 16, height: '66%' },
              { left: 16, right: 86, top: '76%', height: '16%' }
            ],
            xAxis: [
              { type: 'category', data: dates, axisLine: { lineStyle: { color: '#1f2942' } }, axisLabel: { color: '#64748b', fontSize: 10 } },
              { type: 'category', gridIndex: 1, data: dates, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#1f2942' } } }
            ],
            yAxis: [
              {
                scale: true,
                position: 'right',
                splitLine: { lineStyle: { color: '#161f33' } },
                axisLabel: {
                  color: '#94a3b8',
                  fontSize: 10,
                  fontFamily: 'JetBrains Mono',
                  formatter: (val) => formatExactPrice(val)
                }
              },
              { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, splitLine: { show: false } }
            ],
            dataZoom: [
              { type: 'inside', xAxisIndex: [0, 1], start: 15, end: 100 }
            ],
            series: [
              {
                name: coin.symbol,
                type: 'candlestick',
                data: ohlc,
                itemStyle: {
                  color: '#00d084',
                  color0: '#ff4d6a',
                  borderColor: '#00d084',
                  borderColor0: '#ff4d6a'
                }
              },
              ...(showMA20 ? [{
                name: 'MA20',
                type: 'line',
                data: ma20,
                smooth: true,
                showSymbol: false,
                lineStyle: { width: 1.8, color: '#f59e0b' }
              }] : []),
              ...(showBOLL ? [
                {
                  name: 'BOLL Upper',
                  type: 'line',
                  data: boll.upper,
                  smooth: true,
                  showSymbol: false,
                  lineStyle: { width: 1, color: '#38bdf8', type: 'dashed' }
                },
                {
                  name: 'BOLL Lower',
                  type: 'line',
                  data: boll.lower,
                  smooth: true,
                  showSymbol: false,
                  lineStyle: { width: 1, color: '#38bdf8', type: 'dashed' }
                }
              ] : []),
              {
                name: 'Volume',
                type: 'bar',
                xAxisIndex: 1,
                yAxisIndex: 1,
                data: vols,
                itemStyle: {
                  color: (params) => params.value[2] > 0 ? 'rgba(0, 208, 132, 0.35)' : 'rgba(255, 77, 106, 0.35)'
                }
              }
            ]
          });

          const handleResize = () => instance.resize();
          window.addEventListener('resize', handleResize);
          return () => {
            window.removeEventListener('resize', handleResize);
            instance.dispose();
          };
        }
      }, [candles, chartEngine, showMA20, showBOLL, coin.symbol, timeframe]);

      return (
        <div className="relative w-full h-full min-h-[385px]">
          {loading && (
            <div className="absolute inset-0 flex items-center justify-center bg-[#0d1322]/75 z-10 text-xs font-mono text-slate-400">
              Loading real {coin.symbol} ({timeframe}) candles...
            </div>
          )}
          <div ref={containerRef} className="w-full h-full min-h-[385px]" />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
